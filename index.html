<body>
  <div id="app" class="app-shell">
    <div class="ambient-stars" aria-hidden="true"></div>
    <div id="loading-screen" class="loading-screen scene-active">
      <p class="eyebrow">Private transmission</p>
      <h1>INITIALIZING<br><em>BIRTHDAY PROTOCOL</em></h1>
      <div class="loading-track"><span id="loading-bar"></span></div>
      <p id="loading-label" class="loading-label">Loading memories...</p>
    </div>
    <main id="scene-stage" class="scene-stage" aria-live="polite"></main>
    <div class="hud" aria-label="Mission controls">
      <button id="audio-toggle" class="icon-button" type="button" aria-label="Mute sound" title="Mute sound">♫</button>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <div id="modal-root"></div>
    <div id="dev-panel" class="dev-panel" hidden></div>
  </div>
  <script src="js/config.js"></script>
