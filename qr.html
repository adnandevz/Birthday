<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Mission QR</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b18;color:#f7f3ea;font:16px system-ui,sans-serif;padding:20px}main{width:min(100%,480px);text-align:center}h1{font:600 3rem Georgia;color:#e8c77a}input,button{width:100%;box-sizing:border-box;padding:15px;margin:8px 0;border-radius:3px;border:1px solid #5b5870;background:#121936;color:#fff}button{background:#e8c77a;color:#11152a;font-weight:bold;cursor:pointer}#qr{margin:26px auto;background:white;padding:18px;width:min(70vw,280px);min-height:40px}small{color:#a9aec4}</style></head><body><main><h1>Mission QR</h1><p>Paste the final HTTPS GitHub Pages URL.</p><input id="url" type="url" placeholder="https://username.github.io/birthday-mission/"><button id="make">Generate QR</button><div id="qr"></div><small>Right-click or long-press the generated code to save it.</small></main><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script><script>const input=document.getElementById('url'),out=document.getElementById('qr');document.getElementById('make').onclick=()=>{out.replaceChildren();const value=input.value.trim();if(!value){out.textContent='Please enter a URL.';return}const canvas=document.createElement('canvas');out.append(canvas);QRCode.toCanvas(canvas,value,{width:280,margin:1,color:{dark:'#080b18',light:'#ffffff'}},error=>{if(error)out.textContent='Could not create the code.'})};</script></body></html>
